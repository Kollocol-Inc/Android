name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read current version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION_NAME ($VERSION_CODE)"

      - name: Prepare keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release.keystore
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/kollocol-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/release/kollocol-${{ steps.version.outputs.name }}.apk

      - name: Check for release-major label
        id: bump_type
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          LABELS=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          if echo "$LABELS" | grep -q "release-major"; then
            echo "type=major" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
          echo "Bump type: $(cat $GITHUB_OUTPUT | grep type | cut -d= -f2)"

      - name: Compute new version
        id: new_version
        run: |
          python3 << 'EOF'
          import os, re

          with open("app/build.gradle.kts") as f:
              content = f.read()

          old_name = re.search(r'versionName = "([^"]+)"', content).group(1)
          old_code = int(re.search(r'versionCode = (\d+)', content).group(1))
          bump_type = "${{ steps.bump_type.outputs.type }}"

          parts = old_name.split('.')
          if bump_type == 'major':
              new_name = f"{int(parts[0]) + 1}.00"
          else:
              last = parts[-1]
              new_num = int(last) + 1
              width = max(len(last), len(str(new_num)))
              parts[-1] = str(new_num).zfill(width)
              new_name = '.'.join(parts)

          new_code = old_code + 1

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"name={new_name}\n")
              out.write(f"code={new_code}\n")

          print(f"New version: {new_name} ({new_code})")
          EOF

      - name: Create version bump branch from develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin develop
          BRANCH="chore/bump-version-${{ steps.new_version.outputs.name }}"
          git checkout -b "$BRANCH" origin/develop

          python3 << 'EOF'
          import re

          with open("app/build.gradle.kts") as f:
              content = f.read()

          new_name = "${{ steps.new_version.outputs.name }}"
          new_code = "${{ steps.new_version.outputs.code }}"

          content = re.sub(r'versionName = "[^"]+"', f'versionName = "{new_name}"', content)
          content = re.sub(r'versionCode = \d+', f'versionCode = {new_code}', content)

          with open("app/build.gradle.kts", "w") as f:
              f.write(content)

          print(f"Updated to {new_name} ({new_code})")
          EOF

          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.name }}"
          git push origin "$BRANCH"
          echo "BUMP_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Create PR to develop
        id: create_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base develop \
            --head "$BUMP_BRANCH" \
            --title "chore: bump version to ${{ steps.new_version.outputs.name }}" \
            --body "Automated version bump after release v${{ steps.version.outputs.name }}.")
          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "Created PR: $PR_URL"

      - name: Auto-merge PR to develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.create_pr.outputs.url }}" \
            --squash \
            --delete-branch \
            --auto || echo "Warning: auto-merge failed (branch protection may be enabled). Please merge manually: ${{ steps.create_pr.outputs.url }}"
